name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Debug catches integer overflow; release is what users run.
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}
      - run: cargo test --workspace ${{ matrix.profile == 'release' && '--release' || '' }}

  lint:
    name: Clippy and rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      # Large-input tests are #[cfg_attr(miri, ignore)]; the tiny configs
      # cover the same code paths.
      - name: Miri (sequential, all checks)
        # `par_sort` also skips the rayon-based doc examples.
        run: cargo miri test --workspace -- --skip parallel --skip par_sort
      # rayon's internals trip both of Miri's aliasing models (Stacked
      # Borrows in crossbeam-epoch, Tree Borrows in rayon-core's scopes;
      # reproducible without ips4o), so the parallel tests run without
      # aliasing checks. Miri still checks data races, use-after-free,
      # out-of-bounds and uninitialized reads. Leak checks are off because
      # the test thread pool outlives main; the tests count drops instead.
      - name: Miri (parallel)
        run: cargo miri test --workspace -- parallel par_sort
        env:
          MIRIFLAGS: -Zmiri-disable-stacked-borrows -Zmiri-ignore-leaks

  benchmarks:
    name: Benchmarks build (with C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libtbb-dev
      - run: cargo clippy -p benchmarks --features cpp --all-targets
      # Smoke run: every sorter checks its output, so this catches layout or
      # ordering mismatches between the Rust types and the C++ shim.
      - run: >
          cargo run -p benchmarks --release --features cpp --
          --types u64,f64,pair,record100,string --max-log 14
          --min-time 0 --min-reps 1 --max-reps 1 > /dev/null
