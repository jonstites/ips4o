[package]
name = "ips4o"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "In-place (parallel) super scalar samplesort (IPS4o)"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["parallel"]
# The parallel sorts (`par_sort_unstable*`), built on rayon.
parallel = ["dep:rayon"]
# Hidden hooks for the fuzz targets in `fuzz/`. Not public API.
fuzzing = ["parallel"]

[dependencies]
rayon = { version = "1", optional = true }
